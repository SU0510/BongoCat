# InSync CI: builds and tests every InSync crate on both platforms.
# BongoCat's own release pipeline (release.yml) is untouched; InSync ships
# via this workflow until it gets a packaging pipeline of its own.
name: insync-verify

on:
  push:
    branches: [master, feat/insync]
    paths:
      - "crates/insync-*"
      - "crates/bongocat-audio/**"
      - "crates/bongocat-storage/**"
      - "crates/bongocat-log/**"
      - "resources/insync/**"
      - "tools/insync-sprites/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/insync-verify.yml"
  pull_request:
    paths:
      - "crates/insync-*"
      - ".github/workflows/insync-verify.yml"

concurrency:
  group: insync-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sprite-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow numpy
      - name: Regenerate and validate sprite assets
        run: |
          python3 tools/insync-sprites/generate_sprites.py
          python3 tools/insync-sprites/validate_sprites.py
      - name: No uncommitted asset drift
        run: git diff --exit-code -- resources/insync

  test-linux:
    runs-on: ubuntu-latest
    needs: sprite-assets
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt -p insync-core -p insync-server -p insync-client -p insync-sprite -p insync-pet-window -p insync-app -- --check
      - name: Clippy
        run: cargo clippy --locked -p insync-core -p insync-server -p insync-client -p insync-sprite -p insync-app --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked -p insync-core -p insync-server -p insync-client -p insync-sprite -p insync-app

  build-macos:
    runs-on: macos-14
    needs: test-linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Build app (aarch64)
        run: cargo build --locked -p insync-app --release
      - name: Build server
        run: cargo build --locked -p insync-server --release
      - uses: actions/upload-artifact@v4
        with:
          name: insync-macos-aarch64
          path: |
            target/release/insync-app
            target/release/insync-server

  build-windows:
    runs-on: windows-2022
    needs: test-linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (all InSync crates, Windows host = real Win32 target)
        run: cargo clippy --locked -p insync-core -p insync-server -p insync-client -p insync-sprite -p insync-pet-window -p insync-app --all-targets -- -D warnings
      - name: Build app + server (x86_64)
        run: |
          cargo build --locked -p insync-app --release --target x86_64-pc-windows-msvc
          cargo build --locked -p insync-server --release --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: insync-windows-x86_64
          path: |
            target/x86_64-pc-windows-msvc/release/insync-app.exe
            target/x86_64-pc-windows-msvc/release/insync-server.exe

  docker-server:
    runs-on: ubuntu-latest
    needs: test-linux
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -t insync-server:ci .
      - name: Smoke the image
        run: |
          docker run -d --name smoke -p 8787:8787 insync-server:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8787/health | grep -q ok; then echo healthy; exit 0; fi
            sleep 1
          done
          echo "server did not become healthy"; docker logs smoke; exit 1
