# InSync CI: builds and tests every InSync crate on both platforms.
# A green run for a commit is what `insync-release.yml` publishes: a tag is only
# released when this workflow succeeded for the tagged commit. BongoCat's own
# pipeline (release.yml) is untouched.
name: insync-verify

on:
  push:
    branches: [master, feat/insync]
    paths:
      # A single `*` does not cross `/`, so `crates/insync-*` alone matched only
      # the crate directories and every edit inside them ran no CI at all.
      - "crates/insync-*/**"
      - "crates/bongocat-audio/**"
      - "crates/bongocat-storage/**"
      - "crates/bongocat-log/**"
      - "resources/insync/**"
      - "tools/insync-sprites/**"
      - "tools/insync-audio/**"
      - "tools/insync-ui/**"
      - "tools/insync-release.py"
      - "tools/tests/test_insync_*.py"
      # The release notes are taken from this file by tag, and the contracts
      # check its headings, so an edit here is a build input like any other.
      - "docs/insync/CHANGELOG.md"
      - ".github/workflows/insync-release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/insync-verify.yml"
  # Kept identical to the push list: a pull request that changes a Cargo file or
  # an asset must run the same jobs a push would, not fall through silently.
  pull_request:
    paths:
      - "crates/insync-*/**"
      - "crates/bongocat-audio/**"
      - "crates/bongocat-storage/**"
      - "crates/bongocat-log/**"
      - "resources/insync/**"
      - "tools/insync-sprites/**"
      - "tools/insync-audio/**"
      - "tools/insync-ui/**"
      - "tools/insync-release.py"
      - "tools/tests/test_insync_*.py"
      - "docs/insync/CHANGELOG.md"
      - ".github/workflows/insync-release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/insync-verify.yml"

concurrency:
  group: insync-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # exact pins: PNG encoder output must byte-match the committed assets
      - run: pip install pillow==12.3.0 numpy==2.5.3
      - name: Regenerate and validate sprite assets
        run: |
          python3 tools/insync-sprites/generate_sprites.py
          python3 tools/insync-sprites/validate_sprites.py
      # Byte comparison is unreliable across platforms (zlib differs between
      # macOS and Ubuntu); compare decoded pixels instead.
      - name: No pixel drift against committed sprites
        run: |
          python3 tools/insync-sprites/generate_sprites.py --out /tmp/insync-regen/sprites
          python3 tools/insync-sprites/check_pixel_drift.py /tmp/insync-regen/sprites
      # The panel's mascot crops derive from the sprite sheets, so they drift
      # whenever the sprites do; regenerate and compare pixels (same reason as
      # above).
      - name: No pixel drift against the committed panel images
        run: python3 tools/insync-ui/generate_ui_images.py --check
      - name: Validate the alarm chime
        run: python3 tools/insync-audio/validate_alarm.py
      # The chime's synthesis uses only exactly-specified float operations, so
      # unlike the PNGs it is stable byte for byte.
      - name: No drift against the committed alarm chime
        run: python3 tools/insync-audio/generate_alarm.py --check

  # The release channel's own contracts: that the six crates agree on one
  # version, that the InSync changelog has an entry for it using the shared
  # section vocabulary, and that `insync-release.yml` only ever publishes
  # artifacts a green run of this workflow produced. Pure file parsing, so it
  # needs neither Rust nor a platform, and it runs here so a bad version or a
  # missing changelog entry fails on the push rather than at tag time.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: InSync version and release contracts
        run: python3 -m unittest discover -s tools/tests -p 'test_insync_*.py'

  # `insync-core`, `insync-server`, `insync-client` and `insync-sprite` have no
  # GPUI and no platform window backend, so they are linted and tested on Linux
  # as well. `insync-pet-window` and `insync-app` are not: GPUI needs the Linux
  # GUI development stack and neither crate is built for Linux, so they are
  # covered by the macOS and Windows jobs below — the same line verify.yml
  # draws for BongoCat's own GPUI product.
  test-linux:
    runs-on: ubuntu-latest
    needs: assets
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: |
          cargo fmt -p insync-core -p insync-server -p insync-client -p insync-sprite \
            -p insync-pet-window -p insync-app -- --check
      - name: Clippy
        run: |
          cargo clippy --locked -p insync-core -p insync-server -p insync-client \
            -p insync-sprite --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked -p insync-core -p insync-server -p insync-client -p insync-sprite

  build-macos:
    runs-on: macos-14
    needs: test-linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: |
          cargo clippy --locked -p insync-core -p insync-server -p insync-client \
            -p insync-sprite -p insync-pet-window -p insync-app --all-targets -- -D warnings
      - name: Tests
        run: |
          cargo test --locked -p insync-core -p insync-server -p insync-client \
            -p insync-sprite -p insync-pet-window -p insync-app
      - name: Build app (aarch64)
        run: cargo build --locked -p insync-app --release
      - name: Build server
        run: cargo build --locked -p insync-server --release
      - uses: actions/upload-artifact@v4
        with:
          name: insync-macos-aarch64
          path: |
            target/release/insync-app
            target/release/insync-server

  build-windows:
    runs-on: windows-2022
    needs: test-linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (all InSync crates, Windows host = real Win32 target)
        run: |
          cargo clippy --locked -p insync-core -p insync-server -p insync-client `
            -p insync-sprite -p insync-pet-window -p insync-app --all-targets -- -D warnings
      - name: Tests (all InSync crates)
        run: |
          cargo test --locked -p insync-core -p insync-server -p insync-client `
            -p insync-sprite -p insync-pet-window -p insync-app
      - name: Build app + server (x86_64)
        run: |
          cargo build --locked -p insync-app --release --target x86_64-pc-windows-msvc
          cargo build --locked -p insync-server --release --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: insync-windows-x86_64
          path: |
            target/x86_64-pc-windows-msvc/release/insync-app.exe
            target/x86_64-pc-windows-msvc/release/insync-server.exe

  docker-server:
    runs-on: ubuntu-latest
    needs: test-linux
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -t insync-server:ci .
      - name: Smoke the image
        run: |
          docker run -d --name smoke -p 8787:8787 insync-server:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8787/health | grep -q ok; then echo healthy; exit 0; fi
            sleep 1
          done
          echo "server did not become healthy"; docker logs smoke; exit 1
